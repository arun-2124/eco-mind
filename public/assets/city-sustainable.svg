<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sust_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#082A2E" />
      <stop offset="50%" stopColor="#0B1E28" />
      <stop offset="100%" stopColor="#070B16" />
    </linearGradient>
  </defs>

  <!-- Clear Emerald Cyan Sky -->
  <rect width="800" height="450" fill="url(#sust_sky)" />
  
  <!-- Modern Clean Glass Towers with Vertical Green Forests -->
  <rect x="60" y="140" width="70" height="240" fill="#0C1D24" stroke="#38E58B" stroke-width="1.5" />
  <rect x="180" y="110" width="80" height="270" fill="#0F2228" stroke="#35D5FF" stroke-width="1.5" />
  <rect x="300" y="80" width="100" height="300" fill="#122A2E" stroke="#38E58B" stroke-width="1.5" />

  <!-- Vertical Greenery Terraces -->
  <g fill="#38E58B" opacity="0.8">
    <rect x="80" y="160" width="30" height="10" rx="3" />
    <rect x="80" y="200" width="30" height="10" rx="3" />
    <rect x="80" y="240" width="30" height="10" rx="3" />
    <rect x="200" y="130" width="40" height="12" rx="3" />
    <rect x="200" y="170" width="40" height="12" rx="3" />
    <rect x="320" y="100" width="60" height="14" rx="3" />
    <rect x="320" y="140" width="60" height="14" rx="3" />
    <rect x="320" y="180" width="60" height="14" rx="3" />
  </g>

  <!-- Central AETHER Spire with Radiant Green Beacon -->
  <polygon points="500,40 540,120 540,380 460,380 460,120" fill="#13302E" stroke="#38E58B" stroke-width="2.5" />
  <circle cx="500" cy="30" r="10" fill="#38E58B" />
  <line x1="500" y1="30" x2="500" y2="5" stroke="#38E58B" stroke-width="3" />
  <circle cx="500" cy="5" r="4" fill="#35D5FF" />

  <!-- Rooftop Clean Wind Turbines -->
  <g stroke="#38E58B" stroke-width="2" fill="none">
    <line x1="100" y1="140" x2="100" y2="100" />
    <circle cx="100" cy="100" r="3" fill="#38E58B" />
    <line x1="100" y1="100" x2="115" y2="90" />
    <line x1="100" y1="100" x2="85" y2="90" />
    <line x1="100" y1="100" x2="100" y2="115" />

    <line x1="220" y1="110" x2="220" y2="70" />
    <circle cx="220" cy="70" r="3" fill="#38E58B" />
    <line x1="220" y1="70" x2="235" y2="60" />
    <line x1="220" y1="70" x2="205" y2="60" />
    <line x1="220" y1="70" x2="220" y2="85" />
  </g>

  <!-- Autonomous Electric Transport Glide Paths on Ground -->
  <rect x="0" y="380" width="800" height="70" fill="#061218" />
  <line x1="0" y1="385" x2="800" y2="385" stroke="#38E58B" stroke-width="3" />

  <!-- Floating Green HUD -->
  <rect x="220" y="30" width="360" height="34" rx="8" fill="#0A221E" stroke="#38E58B" stroke-width="1.5" />
  <text x="400" y="52" fill="#38E58B" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">
    NOVA CITY: THRIVING ECO-INTELLIGENCE (PHASE V)
  </text>
</svg>
