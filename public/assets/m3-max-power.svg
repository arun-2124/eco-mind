<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="max_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#250B0E" />
      <stop offset="50%" stopColor="#1B0709" />
      <stop offset="100%" stopColor="#070B16" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#max_bg)" />

  <!-- Overheating GPU Racks Left -->
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="220" height="200" rx="12" fill="#180A0C" stroke="#FF5B65" stroke-width="2.5" />
    
    <!-- Red glowing heat waves -->
    <path d="M40,-10 Q50,-30 40,-45" stroke="#FF5B65" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M110,-10 Q120,-30 110,-45" stroke="#FF5B65" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M180,-10 Q190,-30 180,-45" stroke="#FF5B65" stroke-width="2" fill="none" opacity="0.6" />

    <text x="110" y="30" fill="#FF5B65" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      100% CONSTANT LOAD
    </text>

    <!-- GPU slots -->
    <rect x="20" y="45" width="180" height="30" rx="4" fill="#2D0B0E" stroke="#FF5B65" stroke-width="1.5" />
    <text x="35" y="65" fill="#FF5B65" font-family="monospace" font-size="10">GPU 01: 99.8°C [MAX FLOPs]</text>
    
    <rect x="20" y="85" width="180" height="30" rx="4" fill="#2D0B0E" stroke="#FF5B65" stroke-width="1.5" />
    <text x="35" y="105" fill="#FF5B65" font-family="monospace" font-size="10">GPU 02: 98.4°C [MAX FLOPs]</text>

    <rect x="20" y="125" width="180" height="30" rx="4" fill="#2D0B0E" stroke="#FF5B65" stroke-width="1.5" />
    <text x="35" y="145" fill="#FF5B65" font-family="monospace" font-size="10">GPU 03: 101.2°C [THROTTLING]</text>

    <text x="110" y="180" fill="#F6B94A" font-family="monospace" font-size="10" text-anchor="middle">
      Idle Night Loads Forced to Max
    </text>
  </g>

  <!-- Gas Peaker Turbine Burning Fossil Fuel (Right) -->
  <g transform="translate(440, 110)">
    <rect x="0" y="0" width="220" height="200" rx="12" fill="#180A0C" stroke="#F6B94A" stroke-width="2" />
    <text x="110" y="30" fill="#F6B94A" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      FOSSIL PEAKER TURBINES
    </text>

    <!-- Smoke Stack -->
    <rect x="70" y="55" width="80" height="85" rx="6" fill="#0D0406" stroke="#FF5B65" stroke-width="1.5" />
    <circle cx="110" cy="95" r="22" fill="#29070A" stroke="#FF5B65" stroke-width="1.5" />
    <polygon points="110,80 120,105 100,105" fill="#FF5B65" />

    <!-- Exhaust particulate cloud -->
    <path d="M110,50 C80,20 140,-10 110,-40" stroke="#98A8BD" stroke-width="4" fill="none" opacity="0.4" />
    <text x="110" y="170" fill="#FF5B65" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">
      +340 Tons CO2 / hr
    </text>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(100, 370)">
    <rect x="0" y="0" width="280" height="45" rx="10" fill="#1C0609" stroke="#FF5B65" stroke-width="1.5" />
    <text x="140" y="27" fill="#FF5B65" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      ✘ EXHAUSTS CITY CARBON LIMITS
    </text>
  </g>

  <g transform="translate(420, 370)">
    <rect x="0" y="0" width="280" height="45" rx="10" fill="#1C0609" stroke="#F6B94A" stroke-width="1.5" />
    <text x="140" y="27" fill="#F6B94A" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      ✘ MASSIVE UNNECESSARY COMPUTATION
    </text>
  </g>

  <!-- Title Banner -->
  <rect x="150" y="20" width="500" height="38" rx="8" fill="#1A0508" stroke="#FF5B65" stroke-width="2" />
  <text x="400" y="44" fill="#FF5B65" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">
    RUN OVERSIZED MODELS AT MAX CAPACITY (UNSUSTAINABLE)
  </text>
</svg>
