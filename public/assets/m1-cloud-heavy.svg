<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cloud_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#25090F" />
      <stop offset="50%" stopColor="#19070B" />
      <stop offset="100%" stopColor="#070B16" />
    </linearGradient>
    <filter id="glow_red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#cloud_bg)" />

  <!-- Congested Radio Frequency Wave Lines -->
  <g stroke="#FF5B65" stroke-opacity="0.4" stroke-width="2.5" fill="none">
    <path d="M220,240 C320,140 450,140 580,180" stroke-dasharray="8,6" />
    <path d="M220,250 C320,150 450,150 580,190" stroke-dasharray="8,6" />
    <path d="M220,260 C320,160 450,160 580,200" stroke-dasharray="8,6" />
  </g>

  <!-- Robot Sending Every Single Sensor Bit -->
  <g transform="translate(100, 160)">
    <!-- Small Robot -->
    <rect x="20" y="70" width="100" height="70" rx="10" fill="#180C10" stroke="#FF5B65" stroke-width="2" />
    <rect x="10" y="130" width="120" height="24" rx="6" fill="#0A0406" stroke="#98A8BD" stroke-width="1.5" />
    <circle cx="35" cy="142" r="6" fill="#FF5B65" />
    <circle cx="70" cy="142" r="6" fill="#FF5B65" />
    <circle cx="105" cy="142" r="6" fill="#FF5B65" />

    <!-- Antenna with Massive Radiation Rings -->
    <line x1="70" y1="70" x2="70" y2="20" stroke="#FF5B65" stroke-width="3" />
    <circle cx="70" cy="20" r="5" fill="#FF5B65" filter="url(#glow_red)" />
    
    <!-- Concentric Radiation Pulses -->
    <circle cx="70" cy="20" r="18" fill="none" stroke="#FF5B65" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="70" cy="20" r="32" fill="none" stroke="#FF5B65" stroke-width="1.5" stroke-dasharray="6,4" />
    <circle cx="70" cy="20" r="48" fill="none" stroke="#FF5B65" stroke-width="1.5" stroke-dasharray="8,4" />

    <!-- Label Under Robot -->
    <text x="70" y="175" fill="#FF5B65" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
      100% RAW UPLOAD (3.4 Gbps)
    </text>
  </g>

  <!-- Giant Cloud Bottleneck / Centralized Server Fire -->
  <g transform="translate(520, 110)">
    <!-- Cloud Silhouette -->
    <path d="M50,130 Q30,130 20,105 Q10,80 35,65 Q45,30 90,30 Q130,15 170,45 Q210,35 220,70 Q245,85 235,115 Q245,130 220,130 Z" fill="#2A0B10" stroke="#FF5B65" stroke-width="3" filter="url(#glow_red)" />

    <!-- Server inside cloud -->
    <rect x="75" y="60" width="90" height="55" rx="6" fill="#0D0406" stroke="#F6B94A" stroke-width="2" />
    <circle cx="90" cy="75" r="4" fill="#FF5B65" />
    <circle cx="105" cy="75" r="4" fill="#FF5B65" />
    <line x1="120" y1="75" x2="150" y2="75" stroke="#FF5B65" stroke-width="2" />
    <rect x="85" y="90" width="70" height="15" rx="3" fill="#1F080A" />

    <!-- Warning / Heat Indicator -->
    <rect x="65" y="145" width="110" height="26" rx="6" fill="#0B0204" stroke="#FF5B65" stroke-width="1.5" />
    <text x="120" y="162" fill="#FF5B65" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
      LATENCY: 480ms!
    </text>
  </g>

  <!-- Network Congestion Packet Drop Graphic -->
  <g transform="translate(340, 150)">
    <polygon points="40,20 60,60 20,60" fill="#F6B94A" />
    <text x="40" y="55" fill="#070B16" font-family="monospace" font-size="18" font-weight="900" text-anchor="middle">!</text>
    <text x="40" y="85" fill="#F6B94A" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
      PACKET LOSS
    </text>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(100, 370)">
    <rect x="0" y="0" width="280" height="45" rx="10" fill="#1C060A" stroke="#FF5B65" stroke-width="1.5" />
    <text x="140" y="27" fill="#FF5B65" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      ✘ HIGH BANDWIDTH OVERHEAD
    </text>
  </g>

  <g transform="translate(420, 370)">
    <rect x="0" y="0" width="280" height="45" rx="10" fill="#1C060A" stroke="#F6B94A" stroke-width="1.5" />
    <text x="140" y="27" fill="#F6B94A" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      ✘ FAILS DURING NETWORK CUT
    </text>
  </g>

  <!-- Option Title Banner -->
  <rect x="180" y="20" width="440" height="38" rx="8" fill="#1F080C" stroke="#FF5B65" stroke-width="2" />
  <text x="400" y="44" fill="#FF5B65" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">
    UNNECESSARY CONTINUOUS CLOUD (UNSUSTAINABLE)
  </text>
</svg>
