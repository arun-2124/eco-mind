      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#B45309" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0C0A09" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#0C0A09"/>
