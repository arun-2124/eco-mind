<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mod_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#081A16" />
      <stop offset="50%" stopColor="#0C2923" />
      <stop offset="100%" stopColor="#070B16" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#mod_bg)" />

  <!-- Circular Repair Workshop Bay Left -->
  <g transform="translate(120, 110)">
    <!-- Durable Aluminum Robot Chassis (85% preserved) -->
    <rect x="20" y="30" width="160" height="180" rx="16" fill="#0C201C" stroke="#38E58B" stroke-width="2.5" />
    <text x="100" y="55" fill="#38E58B" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
      PRESERVED CHASSIS (85%)
    </text>

    <!-- Internal Bay showing Modular Slot -->
    <rect x="40" y="70" width="120" height="120" rx="8" fill="#061210" stroke="#35D5FF" stroke-dasharray="4,4" />
    
    <!-- Plug-and-Play NPU Daughterboard being inserted -->
    <g transform="translate(50, 85)">
      <rect x="0" y="0" width="100" height="70" rx="6" fill="#11362E" stroke="#38E58B" stroke-width="2" />
      <text x="50" y="28" fill="#38E58B" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">
        NPU MODULE
      </text>
      <text x="50" y="45" fill="#35D5FF" font-family="monospace" font-size="9" text-anchor="middle">
        Plug & Play Slot
      </text>
      <!-- Gold pins -->
      <line x1="15" y1="65" x2="85" y2="65" stroke="#F6B94A" stroke-width="4" stroke-dasharray="6,4" />
    </g>

    <text x="100" y="180" fill="#38E58B" font-family="monospace" font-size="10" text-anchor="middle">
      20-Min Swap Time
    </text>
  </g>

  <!-- Circular Economy Badge & Arrows Center -->
  <g transform="translate(480, 110)">
    <circle cx="100" cy="100" r="85" fill="#0A201A" stroke="#38E58B" stroke-width="2" />
    <!-- 3 Circular Arrows -->
    <path d="M100,30 A70,70 0 0,1 160,100" fill="none" stroke="#38E58B" stroke-width="4" />
    <polygon points="160,100 168,85 152,85" fill="#38E58B" />

    <path d="M160,100 A70,70 0 0,1 100,170" fill="none" stroke="#35D5FF" stroke-width="4" />
    <polygon points="100,170 115,162 115,178" fill="#35D5FF" />

    <path d="M100,170 A70,70 0 0,1 40,100" fill="none" stroke="#F6B94A" stroke-width="4" />
    <polygon points="40,100 32,115 48,115" fill="#F6B94A" />

    <text x="100" y="95" fill="#38E58B" font-family="monospace" font-size="13" font-weight="900" text-anchor="middle">
      CIRCULAR
    </text>
    <text x="100" y="115" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
      ECONOMY
    </text>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(100, 370)">
    <rect x="0" y="0" width="280" height="45" rx="10" fill="#0A201A" stroke="#38E58B" stroke-width="1.5" />
    <text x="140" y="27" fill="#38E58B" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      ✔ -88% ELECTRONIC WASTE
    </text>
  </g>

  <g transform="translate(420, 370)">
    <rect x="0" y="0" width="280" height="45" rx="10" fill="#0A201A" stroke="#35D5FF" stroke-width="1.5" />
    <text x="140" y="27" fill="#35D5FF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      ✔ SAVES $380M PROCUREMENT
    </text>
  </g>

  <!-- Title Banner -->
  <rect x="150" y="20" width="500" height="38" rx="8" fill="#071915" stroke="#38E58B" stroke-width="2" />
  <text x="400" y="44" fill="#38E58B" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">
    REPAIR, REUSE & UPGRADE MODULAR SILICON (SUSTAINABLE)
  </text>
</svg>
