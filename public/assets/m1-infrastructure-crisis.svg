<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="m1_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="60%" stopColor="#1C2541" />
      <stop offset="100%" stopColor="#070B16" />
    </linearGradient>
    <linearGradient id="m1_grid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#35D5FF" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#38E58B" stopOpacity="0.8" />
    </linearGradient>
    <linearGradient id="server_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>
    <filter id="glow_cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#m1_sky)" />
  
  <!-- Perspective Cyber Floor Grid -->
  <g stroke="#35D5FF" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="0" y1="450" x2="400" y2="220" />
    <line x1="150" y1="450" x2="400" y2="220" />
    <line x1="300" y1="450" x2="400" y2="220" />
    <line x1="500" y1="450" x2="400" y2="220" />
    <line x1="650" y1="450" x2="400" y2="220" />
    <line x1="800" y1="450" x2="400" y2="220" />
    <line x1="100" y1="360" x2="700" y2="360" />
    <line x1="200" y1="300" x2="600" y2="300" />
    <line x1="280" y1="260" x2="520" y2="260" />
  </g>

  <!-- Massive Server Racks (Data Center) -->
  <!-- Left Rack Cluster -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="110" height="280" rx="6" fill="url(#server_grad)" stroke="#35D5FF" stroke-width="1.5" stroke-opacity="0.6" />
    <rect x="10" y="15" width="90" height="15" rx="3" fill="#0A0F1D" />
    <circle cx="20" cy="22" r="3" fill="#35D5FF" />
    <circle cx="30" cy="22" r="3" fill="#38E58B" />
    <line x1="45" y1="22" x2="90" y2="22" stroke="#35D5FF" stroke-dasharray="2,2" stroke-width="2" />
    
    <rect x="10" y="40" width="90" height="15" rx="3" fill="#0A0F1D" />
    <circle cx="20" cy="47" r="3" fill="#FF5B65" />
    <circle cx="30" cy="47" r="3" fill="#35D5FF" />
    <line x1="45" y1="47" x2="90" y2="47" stroke="#35D5FF" stroke-dasharray="2,2" stroke-width="2" />

    <rect x="10" y="65" width="90" height="15" rx="3" fill="#0A0F1D" />
    <circle cx="20" cy="72" r="3" fill="#38E58B" />
    <circle cx="30" cy="72" r="3" fill="#38E58B" />
    <line x1="45" y1="72" x2="90" y2="72" stroke="#38E58B" stroke-dasharray="2,2" stroke-width="2" />

    <rect x="10" y="90" width="90" height="15" rx="3" fill="#0A0F1D" />
    <circle cx="20" cy="97" r="3" fill="#F6B94A" />
    <circle cx="30" cy="97" r="3" fill="#35D5FF" />

    <rect x="10" y="115" width="90" height="15" rx="3" fill="#0A0F1D" />
    <circle cx="20" cy="122" r="3" fill="#38E58B" />
    <circle cx="30" cy="122" r="3" fill="#38E58B" />

    <rect x="10" y="140" width="90" height="15" rx="3" fill="#0A0F1D" />
    <circle cx="20" cy="147" r="3" fill="#FF5B65" />
    <circle cx="30" cy="147" r="3" fill="#F6B94A" />
  </g>

  <!-- Right Rack Cluster -->
  <g transform="translate(650, 80)">
    <rect x="0" y="0" width="110" height="280" rx="6" fill="url(#server_grad)" stroke="#35D5FF" stroke-width="1.5" stroke-opacity="0.6" />
    <rect x="10" y="15" width="90" height="15" rx="3" fill="#0A0F1D" />
    <circle cx="20" cy="22" r="3" fill="#38E58B" />
    <circle cx="30" cy="22" r="3" fill="#35D5FF" />
    <line x1="45" y1="22" x2="90" y2="22" stroke="#35D5FF" stroke-dasharray="2,2" stroke-width="2" />

    <rect x="10" y="40" width="90" height="15" rx="3" fill="#0A0F1D" />
    <circle cx="20" cy="47" r="3" fill="#F6B94A" />
    <circle cx="30" cy="47" r="3" fill="#FF5B65" />
    
    <rect x="10" y="65" width="90" height="15" rx="3" fill="#0A0F1D" />
    <circle cx="20" cy="72" r="3" fill="#35D5FF" />
    <circle cx="30" cy="72" r="3" fill="#35D5FF" />

    <rect x="10" y="90" width="90" height="15" rx="3" fill="#0A0F1D" />
    <circle cx="20" cy="97" r="3" fill="#FF5B65" />
    <circle cx="30" cy="97" r="3" fill="#FF5B65" />
  </g>

  <!-- Central Monolith Cloud Core with Transmission Pulses -->
  <g transform="translate(280, 50)">
    <polygon points="120,10 220,60 220,200 120,250 20,200 20,60" fill="#0E1E38" stroke="#35D5FF" stroke-width="2" filter="url(#glow_cyan)" />
    <!-- Data center heat warning glow -->
    <circle cx="120" cy="130" r="50" fill="#FF5B65" fill-opacity="0.15" />
    <circle cx="120" cy="130" r="30" fill="#35D5FF" fill-opacity="0.25" />
    <path d="M120,80 L120,180 M70,130 L170,130" stroke="#35D5FF" stroke-width="2" />
    
    <!-- Central HUD Overlay -->
    <rect x="60" y="170" width="120" height="26" rx="4" fill="#070B16" stroke="#F6B94A" stroke-width="1.5" />
    <text x="120" y="187" fill="#F6B94A" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
      GRID LOAD: 94.8%
    </text>
  </g>

  <!-- Glowing Telemetry Wave Cables from Robots -->
  <path d="M150,380 C250,330 350,280 380,240" fill="none" stroke="#FF5B65" stroke-width="3" stroke-dasharray="8,4" />
  <path d="M650,380 C550,330 450,280 420,240" fill="none" stroke="#F6B94A" stroke-width="3" stroke-dasharray="8,4" />

  <!-- Autonomous Robot Transmitting Heavy Data -->
  <g transform="translate(350, 310)">
    <!-- Robot Chassis -->
    <rect x="20" y="40" width="60" height="40" rx="8" fill="#1E293B" stroke="#35D5FF" stroke-width="2" />
    <!-- Tracks -->
    <rect x="10" y="75" width="80" height="16" rx="4" fill="#0F172A" stroke="#98A8BD" stroke-width="1.5" />
    <!-- Sensor Head -->
    <rect x="35" y="20" width="30" height="20" rx="4" fill="#0F172A" stroke="#38E58B" stroke-width="1.5" />
    <circle cx="50" cy="30" r="5" fill="#35D5FF" />
    <!-- Transmission Antenna with warning rings -->
    <line x1="50" y1="20" x2="50" y2="5" stroke="#35D5FF" stroke-width="2" />
    <circle cx="50" cy="5" r="3" fill="#FF5B65" />
    <circle cx="50" cy="5" r="8" fill="none" stroke="#FF5B65" stroke-width="1" stroke-dasharray="3,2" />
    <circle cx="50" cy="5" r="14" fill="none" stroke="#FF5B65" stroke-width="1" stroke-dasharray="4,2" />
  </g>

  <!-- Banner Headline -->
  <rect x="200" y="15" width="400" height="32" rx="8" fill="#0D162B" stroke="#35D5FF" stroke-width="1" />
  <text x="400" y="36" fill="#35D5FF" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">
    MISSION 01: THE AI INFRASTRUCTURE CRISIS
  </text>
</svg>
