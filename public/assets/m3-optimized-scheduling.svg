<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="opt_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#081A18" />
      <stop offset="50%" stopColor="#0D2C28" />
      <stop offset="100%" stopColor="#070B16" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#opt_bg)" />

  <!-- Left Side: Model Quantization Diagram (FP32 -> INT8) -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="260" height="190" rx="14" fill="#0A221E" stroke="#38E58B" stroke-width="2" />
    <text x="130" y="28" fill="#38E58B" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      ALGORITHMIC COMPRESSION
    </text>

    <!-- Heavy 32-bit float -->
    <rect x="25" y="45" width="210" height="35" rx="6" fill="#143630" stroke="#98A8BD" stroke-width="1" />
    <text x="35" y="66" fill="#98A8BD" font-family="monospace" font-size="10">
      FP32 Weight Matrix (12.4 GB)
    </text>
    
    <!-- Down Arrow / Quantization Funnel -->
    <path d="M130,85 L130,110 M122,102 L130,110 L138,102" stroke="#38E58B" stroke-width="2.5" fill="none" />
    <text x="130" y="100" fill="#35D5FF" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">
      INT8 Quantization
    </text>

    <!-- Compact 8-bit quantized weights -->
    <rect x="25" y="120" width="210" height="35" rx="6" fill="#0A3F35" stroke="#38E58B" stroke-width="2" />
    <text x="35" y="142" fill="#38E58B" font-family="monospace" font-size="11" font-weight="bold">
      INT8 Compact (3.1 GB) • -75% FLOPs
    </text>

    <text x="130" y="175" fill="#35D5FF" font-family="monospace" font-size="10" text-anchor="middle">
      ✔ 98.4% Accuracy Preserved
    </text>
  </g>

  <!-- Right Side: Carbon-Aware Workload Clock Scheduling -->
  <g transform="translate(440, 120)">
    <rect x="0" y="0" width="260" height="190" rx="14" fill="#0A221E" stroke="#35D5FF" stroke-width="2" />
    <text x="130" y="28" fill="#35D5FF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      CARBON-AWARE SCHEDULER
    </text>

    <!-- 24-hr Timeline bar -->
    <rect x="20" y="55" width="220" height="20" rx="4" fill="#051512" />
    <!-- Peak fossil daytime (paused) -->
    <rect x="20" y="55" width="110" height="20" fill="#FF5B65" fill-opacity="0.3" />
    <text x="75" y="69" fill="#FF5B65" font-family="monospace" font-size="9" text-anchor="middle">
      PAUSED (Peak)
    </text>

    <!-- Nocturnal Wind Clean Energy Window (running) -->
    <rect x="130" y="55" width="110" height="20" fill="#38E58B" fill-opacity="0.8" />
    <text x="185" y="69" fill="#070B16" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">
      ACTIVE (Wind)
    </text>

    <!-- Wind Turbine Graphic -->
    <g transform="translate(130, 95)" stroke="#38E58B" stroke-width="2" fill="none">
      <line x1="0" y1="50" x2="0" y2="10" />
      <circle cx="0" cy="10" r="3" fill="#38E58B" />
      <line x1="0" y1="10" x2="15" y2="0" />
      <line x1="0" y1="10" x2="-15" y2="0" />
      <line x1="0" y1="10" x2="0" y2="25" />
    </g>

    <text x="130" y="175" fill="#38E58B" font-family="monospace" font-size="10" text-anchor="middle">
      ✔ 100% Curtailed Clean Power Used
    </text>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(100, 370)">
    <rect x="0" y="0" width="280" height="45" rx="10" fill="#0A221E" stroke="#38E58B" stroke-width="1.5" />
    <text x="140" y="27" fill="#38E58B" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      ✔ -65% INFERENCE ELECTRICITY
    </text>
  </g>

  <g transform="translate(420, 370)">
    <rect x="0" y="0" width="280" height="45" rx="10" fill="#0A221E" stroke="#35D5FF" stroke-width="1.5" />
    <text x="140" y="27" fill="#35D5FF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      ✔ STABILIZES CITY GRID PEAK
    </text>
  </g>

  <!-- Title Banner -->
  <rect x="150" y="20" width="500" height="38" rx="8" fill="#071E1A" stroke="#38E58B" stroke-width="2" />
  <text x="400" y="44" fill="#38E58B" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">
    OPTIMIZE MODELS & TIME WORKLOADS (SUSTAINABLE)
  </text>
</svg>
