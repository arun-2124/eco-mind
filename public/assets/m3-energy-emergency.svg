<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="m3_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#2E1B0E" />
      <stop offset="60%" stopColor="#1E140C" />
      <stop offset="100%" stopColor="#070B16" />
    </linearGradient>
    <filter id="m3_amber_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#m3_sky)" />

  <!-- Blazing Heatwave Sun Icon with Thermal Rays -->
  <g transform="translate(400, 90)">
    <circle cx="0" cy="0" r="45" fill="#F6B94A" filter="url(#m3_amber_glow)" />
    <circle cx="0" cy="0" r="30" fill="#FF5B65" />
    <!-- Thermal Haze Rings -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#F6B94A" stroke-dasharray="4,4" opacity="0.6" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#FF5B65" stroke-dasharray="6,6" opacity="0.4" />
  </g>

  <!-- City Skyline with Power Transmission Towers -->
  <!-- Transmission Pylon Left -->
  <g transform="translate(80, 140)" stroke="#F6B94A" stroke-width="2" fill="none">
    <line x1="40" y1="240" x2="60" y2="20" />
    <line x1="80" y1="240" x2="60" y2="20" />
    <line x1="30" y1="70" x2="90" y2="70" />
    <line x1="20" y1="120" x2="100" y2="120" />
    <line x1="10" y1="170" x2="110" y2="170" />
    <!-- Crossed lattice -->
    <line x1="30" y1="70" x2="100" y2="120" />
    <line x1="90" y1="70" x2="20" y2="120" />
    <!-- Power line arcs sparking -->
    <path d="M60,20 C180,60 300,100 420,120" stroke="#FF5B65" stroke-dasharray="6,4" />
  </g>

  <!-- Data Center Cooling Towers (Evaporating Water into Smog) -->
  <g transform="translate(220, 200)">
    <!-- Tower Body -->
    <path d="M20,180 Q35,80 15,30 L75,30 Q55,80 70,180 Z" fill="#181B26" stroke="#F6B94A" stroke-width="2" />
    <!-- Vapor plume -->
    <path d="M35,30 C20,0 30,-30 45,-50 C60,-30 70,0 55,30 Z" fill="#98A8BD" fill-opacity="0.3" />
    
    <path d="M100,180 Q115,80 95,40 L155,40 Q135,80 150,180 Z" fill="#181B26" stroke="#F6B94A" stroke-width="2" />
    <path d="M115,40 C100,10 110,-20 125,-40 C140,-20 150,10 135,40 Z" fill="#98A8BD" fill-opacity="0.3" />
    <text x="85" y="195" fill="#F6B94A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">
      EVAPORATIVE COOLING: CRITICAL
    </text>
  </g>

  <!-- Derated Solar Canopy Array on Right -->
  <g transform="translate(520, 220)">
    <polygon points="10,80 180,30 240,120 70,170" fill="#0C1D2A" stroke="#35D5FF" stroke-width="2" />
    <!-- Grid cells -->
    <line x1="50" y1="68" x2="110" y2="158" stroke="#35D5FF" opacity="0.6" />
    <line x1="90" y1="56" x2="150" y2="146" stroke="#35D5FF" opacity="0.6" />
    <line x1="130" y1="44" x2="190" y2="134" stroke="#35D5FF" opacity="0.6" />
    <!-- Thermal Warning on Solar -->
    <rect x="50" y="80" width="130" height="24" rx="4" fill="#240D0B" stroke="#FF5B65" stroke-width="1.5" />
    <text x="115" y="96" fill="#FF5B65" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">
      DERATED: -18% (HEAT)
    </text>
  </g>

  <!-- Big Central Grid Emergency Gauge -->
  <g transform="translate(330, 280)">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#0E1624" stroke="#FF5B65" stroke-width="2" filter="url(#m3_amber_glow)" />
    <text x="70" y="24" fill="#FF5B65" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">
      GRID HEADROOM
    </text>
    <text x="70" y="48" fill="#F6B94A" font-family="monospace" font-size="18" font-weight="900" text-anchor="middle">
      350 MW
    </text>
    <text x="70" y="62" fill="#98A8BD" font-family="monospace" font-size="9" text-anchor="middle">
      STAGE 4 ALERT
    </text>
  </g>

  <!-- Banner Headline -->
  <rect x="200" y="15" width="400" height="32" rx="8" fill="#1C140C" stroke="#F6B94A" stroke-width="1" />
  <text x="400" y="36" fill="#F6B94A" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">
    MISSION 03: THE ENERGY EMERGENCY
  </text>
</svg>
