<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="teleop_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#200B0E" />
      <stop offset="50%" stopColor="#150608" />
      <stop offset="100%" stopColor="#070B16" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#teleop_bg)" />

  <!-- Robot Frozen mid-action due to connection lag -->
  <g transform="translate(140, 150)">
    <rect x="10" y="50" width="90" height="60" rx="10" fill="#1C090D" stroke="#FF5B65" stroke-width="2.5" />
    <rect x="0" y="95" width="110" height="25" rx="6" fill="#0A0304" stroke="#98A8BD" stroke-width="2" />
    <circle cx="25" cy="107" r="7" fill="#FF5B65" />
    <circle cx="55" cy="107" r="7" fill="#FF5B65" />
    <circle cx="85" cy="107" r="7" fill="#FF5B65" />

    <!-- Radio Tower with Red Glitch waves -->
    <line x1="55" y1="50" x2="55" y2="10" stroke="#FF5B65" stroke-width="2" />
    <polygon points="55,0 45,20 65,20" fill="#FF5B65" />
    <circle cx="55" cy="0" r="15" fill="none" stroke="#FF5B65" stroke-dasharray="4,4" />

    <!-- Glitch status box -->
    <rect x="0" y="130" width="110" height="22" rx="4" fill="#0C0305" stroke="#FF5B65" stroke-width="1" />
    <text x="55" y="145" fill="#FF5B65" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">
      SIGNAL DROPPED
    </text>
  </g>

  <!-- Heavy continuous video stream pipe with buffer delay -->
  <g transform="translate(320, 160)">
    <rect x="0" y="20" width="180" height="40" rx="8" fill="#1F070B" stroke="#FF5B65" stroke-width="2" />
    <text x="90" y="44" fill="#FF5B65" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
      4K VIDEO BUFFERING...
    </text>

    <!-- Spinning Loading Indicator -->
    <circle cx="90" cy="85" r="16" fill="none" stroke="#F6B94A" stroke-width="3" stroke-dasharray="25,10" />
    <text x="90" y="125" fill="#F6B94A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">
      LATENCY: 850ms
    </text>
  </g>

  <!-- Distant Remote Operator Screen (Right) Stressed -->
  <g transform="translate(540, 120)">
    <rect x="20" y="20" width="160" height="200" rx="14" fill="#140608" stroke="#FF5B65" stroke-width="2" />
    <rect x="30" y="32" width="140" height="150" rx="8" fill="#060102" />
    
    <text x="100" y="55" fill="#FF5B65" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">
      PILOT DESK (LAGGED)
    </text>

    <!-- Static Noise Screen -->
    <rect x="45" y="65" width="110" height="70" rx="4" fill="#1A0A0C" stroke="#FF5B65" stroke-width="1" />
    <line x1="50" y1="80" x2="150" y2="80" stroke="#FF5B65" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="50" y1="100" x2="150" y2="100" stroke="#FF5B65" stroke-dasharray="5,2" opacity="0.6" />
    <line x1="50" y1="120" x2="150" y2="120" stroke="#FF5B65" stroke-dasharray="2,4" opacity="0.6" />
    
    <text x="100" y="105" fill="#FF5B65" font-family="monospace" font-size="10" font-weight="900" text-anchor="middle">
      FEED FROZEN
    </text>

    <!-- Alert -->
    <rect x="45" y="145" width="110" height="24" rx="4" fill="#FF5B65" />
    <text x="100" y="161" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">
      ROBOT STALLED
    </text>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(100, 370)">
    <rect x="0" y="0" width="280" height="45" rx="10" fill="#1C060A" stroke="#FF5B65" stroke-width="1.5" />
    <text x="140" y="27" fill="#FF5B65" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      ✘ FAILS UNDER DEGRADED RADIO
    </text>
  </g>

  <g transform="translate(420, 370)">
    <rect x="0" y="0" width="280" height="45" rx="10" fill="#1C060A" stroke="#F6B94A" stroke-width="1.5" />
    <text x="140" y="27" fill="#F6B94A" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      ✘ HIGH OPERATOR FATIGUE
    </text>
  </g>

  <!-- Option Title Banner -->
  <rect x="150" y="20" width="500" height="38" rx="8" fill="#1A0508" stroke="#FF5B65" stroke-width="2" />
  <text x="400" y="44" fill="#FF5B65" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">
    CONTINUOUS SENSOR STREAMING FOR EVERY STEP (UNSUSTAINABLE)
  </text>
</svg>
